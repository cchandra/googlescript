name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform/build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Patch Compose import
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/charlie/scriptwatch/MainActivity.kt')
          s = p.read_text()
          needle = 'import androidx.activity.ComponentActivity\n'
          imp = 'import androidx.activity.compose.setContent\n'
          if imp not in s:
              s = s.replace(needle, needle + imp)
              p.write_text(s)
          PY

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ScriptWatch-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
